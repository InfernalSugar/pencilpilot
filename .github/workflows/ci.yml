name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Drawing together (crates/share) on the systems friends use: apps connecting, host
  # hand-over, our own relay, and once over the internet through iroh's public relays.
  share:
    name: Drawing together (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pencilpilot-share
      # (the public relays can be busy: a failure here is reported, not blocking)
      - run: cargo test -p pencilpilot-share -- --ignored --nocapture
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm wasm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      # (the director plugin's tests use ffmpeg)
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm test
      - run: pnpm --filter @pencilpilot/web exec playwright install --with-deps chromium
      - run: pnpm --filter @pencilpilot/web exec playwright test
      - run: pnpm --filter @pencilpilot/studio exec playwright test
