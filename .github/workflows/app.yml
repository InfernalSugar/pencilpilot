name: App

# The PencilPilot app (apps/studio): its Rust shell, and installers for Linux, Windows
# and macOS. Runs when the app, the shared packages or the paint engine change, every
# night, and by hand ("Run workflow"). Installers are kept as artifacts for 14 days.
# They are not signed yet (S11-T01).

on:
  pull_request:
    paths:
      - apps/studio/**
      - packages/**
      - crates/brush/**
      - crates/brush-wasm/**
      - pnpm-lock.yaml
      - .github/workflows/app.yml
  push:
    branches: [dev, main]
    paths:
      - apps/studio/**
      - packages/**
      - crates/brush/**
      - crates/brush-wasm/**
      - pnpm-lock.yaml
      - .github/workflows/app.yml
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

jobs:
  shell:
    name: Rust shell (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio/src-tauri
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  bundle:
    name: Installers (${{ matrix.name }})
    needs: shell
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported Ubuntu, so the Linux builds run on older systems too
          - { name: Linux, os: ubuntu-22.04 }
          - { name: Windows, os: windows-latest }
          - { name: macOS (Apple silicon), os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/studio/src-tauri -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm wasm:brush
      # only the app and what it uses (not the website's server packages)
      - run: pnpm install --frozen-lockfile --filter "@pencilpilot/studio..."
      - run: pnpm --filter @pencilpilot/studio tauri build
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: PencilPilot-${{ runner.os }}
          path: |
            apps/studio/src-tauri/target/release/bundle/deb/*.deb
            apps/studio/src-tauri/target/release/bundle/rpm/*.rpm
            apps/studio/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/studio/src-tauri/target/release/bundle/msi/*.msi
            apps/studio/src-tauri/target/release/bundle/nsis/*.exe
            apps/studio/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
