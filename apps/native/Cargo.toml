[package]
name = "pencilpilot-native"
description = "PencilPilot as a native app (the rebuild): for now, Phase 1's canvas, drawn with the pen and measured"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "pencilpilot"
path = "src/main.rs"

[dependencies]
pencilpilot-brush = { path = "../../crates/brush" }
pencilpilot-gpu = { path = "../../crates/gpu" }
pencilpilot-window = { path = "../../crates/window" }
hokusai = { version = "0.3", default-features = false, features = ["myb-json"] }
pencilpilot-ui = { path = "../../crates/ui" }
pencilpilot-export = { path = "../../crates/export" }
# sound: decoding, playing in step with the picture, the export's mix
pencilpilot-sound = { path = "../../crates/sound" }
png = "0.18"
cosmic-text = "0.19"
rayon = "1"
# project files (.ppstudio)
pencilpilot-ppstudio = { path = "../../crates/ppstudio" }
serde_json = "1"
# drawings not showing, kept compressed
miniz_oxide = "0.8"
# (the threads decoding drawings ahead run at a lower priority)
libc = "0.2"
# the desktop portal (the system file dialog), over D-Bus
zbus = "5"
# (an export runs at a lower priority than the window)
# drawing together: the live session (peer to peer), on its own thread and runtime
pencilpilot-share = { path = "../../crates/share" }
# …and its drawing side: the edits, who may draw where, tiles on the wire (the current app's)
pencilpilot-together = { path = "../../crates/together" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
data-encoding = "2"

[dev-dependencies]
# (the export checks build an engine from the measuring fixtures)
pencilpilot-ppstudio = { path = "../../crates/ppstudio" }
gif = "0.14"
