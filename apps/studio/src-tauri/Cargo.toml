[package]
name = "pencilpilot-studio"
description = "PencilPilot: the drawing and frame-by-frame animation app"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/InfernalSugar/pencilpilot"

[lib]
# staticlib / cdylib for the iPad and Android builds, rlib for the desktop binary
name = "pencilpilot_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pencilpilot-ppstudio = { path = "../../../crates/ppstudio" }
pencilpilot-anim = { path = "../../../crates/anim" }
pencilpilot-share = { path = "../../../crates/share" }
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util"] }
# signing in with a PencilPilot account (account.rs): the same HTTP and TLS (ring) as iroh's
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
rand = "0.9"
data-encoding = "2"
tauri-plugin-dialog = "2"
blake3 = "1"
png = "0.18"
gif = "0.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
