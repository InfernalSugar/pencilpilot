# Diagnosis rules: measurement → mistake. See docs/planning/CONTENT_GUIDE.md.
#
# A rule fires when its measurement is `above` / `below` the threshold (with
# `abs = true` the absolute value is compared). `severity` (1–5) is scaled up
# by how far past the threshold the value is; the top 2–3 fixes are shown,
# at most one per `skill`.
#
# `span` (optional): how far past the threshold counts as maximally bad
# (default: the threshold itself). Severity = severity × (1 + min(1, excess / span)).
# `number` turns the value into the {n} placeholder:
#   ratio_pct = |value − 1| × 100   (scale_ratio, contrast_ratio)
#   abs_pct   = |value| × 100       (aspect_error, offsets, retrace_ratio)
#   pct       = value × 100         (0–1 similarities)
#   deg       = value               (angles)
# `dir_pos` / `dir_neg` fill {dir} from the sign of the value.
# `overlay` tells the results screen what to draw: bbox, offset, grid, missing, extra.
# `min` / `max` (optional): the rule only fires when the value is inside them.
# `categories` (optional) limits a rule to some categories.

# ── Size & placement ────────────────────────────────────────────────
[[rule]]
id = "too-big"
span = 0.3
measurement = "scale_ratio"
above = 1.15
severity = 4
skill = "placement"
number = "ratio_pct"
overlay = "bbox"
lesson = "measuring-with-units"
drill = "block-in-boxes"

[[rule]]
id = "too-small"
span = 0.3
measurement = "scale_ratio"
below = 0.85
severity = 4
skill = "placement"
number = "ratio_pct"
overlay = "bbox"
lesson = "measuring-with-units"
drill = "block-in-boxes"

[[rule]]
id = "wrong-width"
span = 0.2
measurement = "aspect_error"
above = 0.12
