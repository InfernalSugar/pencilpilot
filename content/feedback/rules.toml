# Diagnosis rules: measurement → mistake. See docs/planning/CONTENT_GUIDE.md.
#
# A rule fires when its measurement is `above` / `below` the threshold (with
# `abs = true` the absolute value is compared). `above`/`below` are strict
# (>, <); `min`/`max` are inclusive (≥, ≤). `severity` (1–5) is scaled up by
# how far past the threshold the value is; the top 2–3 fixes are shown, at
# most one per `skill`.
#
# `span` (optional): how far past the threshold counts as maximally bad
# (default: the threshold itself). Severity = severity × (1 + min(1, excess / span)).
# `number` turns the value into the {n} placeholder:
#   ratio_pct = |value − 1| × 100   (scale_ratio, contrast_ratio)
#   abs_pct   = |value| × 100       (aspect_error, offsets, retrace_ratio, keypoint errors)
#   pct       = value × 100         (0–1 similarities, speed_cv)
#   deg       = value               (angles)
#   rad_deg   = value × 180 / π     (curvature_jitter, radians → degrees)
#   count     = value               (stroke_count)
# `dir_pos` / `dir_neg` fill {dir} from the sign of the value.
# `overlay` tells the results screen what to draw: bbox, offset, grid, missing, extra.
# `min` / `max` (optional): the rule only fires when the value is inside them.
# `categories` (optional) limits a rule to some categories.
#
# Conventions (checked by the tests in crates/feedback):
# - Graded bands: a mild band uses `above = a` + `max = b`, the strong band
#   `above = b`, so exactly one band fires for any value (same for `below` +
#   `min`). Mild bands get a lower severity.
# - Category overrides: when a category gets its own version of a rule, the
#   generic rule lists every *other* category in `categories`, so for any
#   (measurement, category, value) at most one rule fires.
# - Categories: anime, cartoon, real-life, animals, environment, fundamentals.

