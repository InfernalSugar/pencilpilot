# LINE CONFIDENCE (needs recorded strokes)
# ════════════════════════════════════════════════════════════════════

# smoothness = exp(−curvature_jitter ÷ 0.35), so the jitter bands below
# stop just before the matching smoothness rule starts.
[[rule]]
id = "shaky-lines"
measurement = "smoothness"
below = 0.5
severity = 3
skill = "line_confidence"
number = "pct"
lesson = "drawing-from-the-shoulder"
drill = "ghosted-lines"
categories = ["real-life", "animals", "environment", "fundamentals"]

[[rule]]
id = "a-bit-wobbly"
measurement = "curvature_jitter"
above = 0.17
max = 0.242
span = 0.07
severity = 1.5
skill = "line_confidence"
number = "rad_deg"
lesson = "drawing-ellipses"
drill = "ellipse-in-boxes"
categories = ["real-life", "animals", "environment", "fundamentals"]

[[rule]]
id = "shaky-lineart"
measurement = "smoothness"
below = 0.6
span = 0.6
severity = 3.5
skill = "line_confidence"
number = "pct"
lesson = "drawing-from-the-shoulder"
drill = "line-weight-pressure"
categories = ["anime", "cartoon"]

[[rule]]
id = "lineart-a-bit-wobbly"
measurement = "curvature_jitter"
above = 0.12
max = 0.178
span = 0.06
severity = 2
skill = "line_confidence"
number = "rad_deg"
lesson = "drawing-ellipses"
drill = "ellipse-pages"
categories = ["anime", "cartoon"]

# ── Retracing ───────────────────────────────────────────────────────
[[rule]]
id = "sketchy-lines"
measurement = "retrace_ratio"
above = 0.2
max = 0.35
span = 0.15
severity = 1.5
skill = "line_confidence"
number = "abs_pct"
lesson = "one-confident-stroke"
drill = "contour-in-one-minute"
categories = ["animals", "fundamentals"]

[[rule]]
id = "hairy-lines"
span = 0.3
measurement = "retrace_ratio"
above = 0.35
severity = 3
skill = "line_confidence"
number = "abs_pct"
lesson = "one-confident-stroke"
drill = "ghosted-lines"
categories = ["anime", "cartoon", "animals", "fundamentals"]

[[rule]]
id = "lineart-retraced"
measurement = "retrace_ratio"
above = 0.12
max = 0.35
span = 0.23
severity = 2.5
skill = "line_confidence"
number = "abs_pct"
lesson = "line-weight"
drill = "line-weight-pressure"
categories = ["anime", "cartoon"]

# Shading lays strokes over strokes, so real life and scenes get more room.
[[rule]]
id = "overworked-shading"
measurement = "retrace_ratio"
above = 0.5
span = 0.3
severity = 2
skill = "line_confidence"
number = "abs_pct"
lesson = "hatching"
drill = "hatching-patches"
categories = ["real-life", "environment"]

# ── Pen speed ───────────────────────────────────────────────────────
# speed_consistency = exp(−speed_cv), so 0.205 ≈ speed_cv 1.585: the two
# rules below never fire together.
[[rule]]
id = "hesitant-speed"
measurement = "speed_consistency"
below = 0.4
min = 0.205
severity = 2
skill = "line_confidence"
number = "pct"
lesson = "drawing-from-the-shoulder"
drill = "ellipse-pages"

[[rule]]
id = "stop-start-strokes"
measurement = "speed_cv"
above = 1.6
span = 1.0
severity = 3
skill = "line_confidence"
number = "pct"
lesson = "gesture-and-flow"
drill = "ghosted-lines"
categories = ["anime", "cartoon", "real-life", "environment", "fundamentals"]

[[rule]]
id = "animal-stiff-strokes"
measurement = "speed_cv"
above = 1.6
span = 1.0
severity = 3
skill = "line_confidence"
number = "pct"
lesson = "gesture-and-flow"
drill = "gesture-30-second"
categories = ["animals"]

# ── Stroke count ────────────────────────────────────────────────────
[[rule]]
id = "many-tiny-strokes"
measurement = "stroke_count"
above = 300
span = 300
severity = 1.5
skill = "line_confidence"
number = "count"
lesson = "one-confident-stroke"
drill = "ghosted-lines"
categories = ["anime", "cartoon"]

[[rule]]
