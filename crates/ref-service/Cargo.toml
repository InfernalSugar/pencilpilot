[package]
name = "pencilpilot-ref-service"
description = "Endless references: a small server that keeps a ready pool of vetted Pixabay pictures per category/topic/tier"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "ref-service"
path = "src/main.rs"

[dependencies]
pencilpilot-grader = { path = "../grader" }
pencilpilot-ref-filters = { path = "../ref-filters" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
