[package]
name = "pencilpilot-brush-wasm"
description = "PencilPilot painting engine: hokusai (libmypaint port) + undo/redo + dirty-rect flattening, for the browser"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "brush"

[dependencies]
hokusai = { version = "0.3", default-features = false, features = ["myb-json"] }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
