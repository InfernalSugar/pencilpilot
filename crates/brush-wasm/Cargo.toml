[package]
name = "pencilpilot-brush-wasm"
description = "JavaScript bindings for the PencilPilot painting engine (pencilpilot-brush), for the browser"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "brush_wasm"

[dependencies]
pencilpilot-brush = { path = "../brush" }
hokusai = { version = "0.3", default-features = false, features = ["myb-json"] }
wasm-bindgen = "0.2"
# tiles from drawing together inflated here (faster than the browser's stream, a tile at a time)
miniz_oxide = "0.9"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
