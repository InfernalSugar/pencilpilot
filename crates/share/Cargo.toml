[package]
name = "pencilpilot-share"
version = "0.1.0"
edition.workspace = true
description = "Shared projects, peer to peer: identity, invites and the live session between apps (over iroh)"
license.workspace = true

[dependencies]
iroh = "1.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
bytes = "1"
data-encoding = "2"
rand = "0.9"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# an in-process relay server for tests (self-signed: test builds skip its certificate check)
iroh = { version = "1.5", features = ["test-utils"] }
