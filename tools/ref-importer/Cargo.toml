[package]
name = "ref-importer"
description = "Fetch licence-clean, SFW reference candidates from Pixabay, and sync approved references"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[dependencies]
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
