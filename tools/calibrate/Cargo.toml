[package]
name = "calibrate"
description = "Check and tune PencilPilot's scoring: synthetic benchmark + fitting the score curve to human labels"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[dependencies]
pencilpilot-grader = { path = "../../crates/grader" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
